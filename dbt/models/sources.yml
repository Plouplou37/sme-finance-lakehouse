version: 2

sources:
  - name: bronze
    description: Raw Kafka events written by the Spark ingestion job (M4), unchanged.
    tables:
      - name: events
        description: >
          One row per Kafka message: the event as JSON text (raw_json) and its Kafka coordinates.
          Spark wrote the files with partitionBy("topic", "ingestion_date"), so the folder names
          topic=…/ingestion_date=… become the columns topic and ingestion_date (hive_partitioning).
          Only *.parquet files are read: Spark's _spark_metadata log is ignored, so files left by an
          interrupted batch would be read too. Duplicates are removed in silver, on event_id.
        meta:
          # The lake root: s3://sme-lake by default, a local folder in CI (same as the lake_root macro;
          # macros are not available in YAML, env_var is).
          external_location: >-
            read_parquet('{{ env_var("LAKE_ROOT", "s3://sme-lake") }}/bronze/topic=*/ingestion_date=*/*.parquet', hive_partitioning = true)
        config:
          # Freshness: is bronze up to date? `dbt source freshness` compares the latest ingested_at
          # with the current time. A warning does not stop anything; an error would.
          loaded_at_field: ingested_at
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 3, period: day}

  - name: generator
    description: Files written by the data generator (M2), read from the repository's data folder.
    tables:
      - name: manifest
        description: >
          The generator's manifest (data/generated/manifest.json): events and anomalies counted by type.
          The independent truth the platform is reconciled with. Read as raw text: one row, the JSON in `content`.
        meta:
          external_location: "read_text('data/generated/manifest.json')"
