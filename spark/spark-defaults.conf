# Spark settings, read by spark-submit at startup.
# Format: key, spaces, value. Comments must be on their own line (text after a value would become part of it).

# Local mode: one JVM holding the driver and 2 task threads; no cluster.
spark.master                                local[2]
spark.driver.memory                         1g
# Partitions after a shuffle (groupBy, join): 200 by default, far too many for our volume.
spark.sql.shuffle.partitions                4
# Dates and times computed by Spark (ingestion_date) are in UTC, like event_time in the event contract.
spark.sql.session.timeZone                  UTC

# s3a connector -> Floci. Hadoop settings are passed through Spark with the "spark.hadoop." prefix.
# Credentials are NOT here: s3a's default chain reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the environment.
spark.hadoop.fs.s3a.endpoint                http://floci:4566
spark.hadoop.fs.s3a.endpoint.region         us-east-1
# Bucket in the path (http://floci:4566/sme-lake/...) rather than in the host name.
spark.hadoop.fs.s3a.path.style.access       true
spark.hadoop.fs.s3a.connection.ssl.enabled  false
# AWS SDK >= 2.30 added default checksums that broke third-party S3 stores (HADOOP-19490).
# These are already the Hadoop 3.5.0 defaults; written here so the choice is visible.
spark.hadoop.fs.s3a.checksum.generation     false
spark.hadoop.fs.s3a.checksum.validation     false
spark.hadoop.fs.s3a.request.md5.header      true
# The new default S3 reader ("analytics") has an open memory leak on long-running jobs (HADOOP-20058).
spark.hadoop.fs.s3a.input.stream.type       classic
