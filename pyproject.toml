[project]
name = "sme-finance-lakehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.126",
    "confluent-kafka==2.16.0",
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.1",
    "duckdb==1.5.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["generator/tests"]
pythonpath = ["."]  # lets the tests import the generator package from the repository root
