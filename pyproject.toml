[project]
name = "sme-finance-lakehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.126",
    "confluent-kafka==2.16.0",
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.1",
    "duckdb==1.5.6",
    "pyarrow==26.0.0",
    "pyiceberg[glue,pyarrow]==0.12.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
    "sqlfluff==4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["generator/tests"]
pythonpath = ["."]  # lets the tests import the generator package from the repository root

# Python lint (M10), run by the CI on every push: `uv run ruff check .`
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Ruff's default rules (pyflakes, and the pycodestyle errors that are always bugs), plus sorted imports (I),
# modern syntax for Python 3.12 (UP) and common bug patterns (B).
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
