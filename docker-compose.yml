# Local data platform: Floci emulates S3, Glue and Athena; Redpanda serves the Kafka API.
# Start with `make up`. Fake credentials come from .env, a copy of .env.example (see README).
name: sme-lake

# Settings shared by every Airflow service (M8). Airflow runs with the LocalExecutor: the scheduler runs
# the tasks itself, as processes. The tasks run dbt locally and send the ingestion job to spark-connect over
# the network: no task creates a container, so Airflow gets no Docker socket.
x-airflow-common: &airflow-common
  image: sme-lake-airflow:3.3.2      # built once, by airflow-init (see its `build`)
  profiles: ["pipeline"]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${AIRFLOW_DB_PASSWORD:?copy .env.example to .env}@airflow-postgres/airflow
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?copy .env.example to .env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # What the tasks need: S3 on Floci, Kafka, Spark Connect, and dbt's own warehouse file.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?copy .env.example to .env}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?copy .env.example to .env}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:?copy .env.example to .env}
    AWS_ENDPOINT_URL: http://floci:4566
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    SPARK_REMOTE: sc://spark-connect:15002
    DBT_DUCKDB_PATH: /opt/airflow/warehouse/warehouse.duckdb   # Airflow's own warehouse, in a volume
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./dbt:/opt/project/dbt
    - ./data:/opt/project/data
    - ./spark/jobs:/opt/project/spark/jobs:ro
    - ./airflow/scripts:/opt/project/airflow/scripts:ro
    - ./scripts:/opt/project/scripts:ro           # publish_gold.py (M12) and check_athena.py (M9)
    - ./analytics:/opt/project/analytics:ro       # the analysis queries run through Athena (M9)
    - airflow-warehouse:/opt/airflow/warehouse
    # Task logs, shared: the tasks write them in the scheduler, and the api-server reads them to show them
    # in the UI. Without it, the api-server must fetch them from the scheduler over the network.
    - airflow-logs:/opt/airflow/logs

services:
  floci:
    image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
    ports:
      - "4566:4566"                 # host tools use http://localhost:4566; containers use http://floci:4566
    environment:
      FLOCI_HOSTNAME: floci         # host name Floci writes in the URLs it returns, reachable from other containers
      FLOCI_STORAGE_MODE: persistent  # write to disk before acknowledging; hybrid lost data on docker kill (ADR 0001)
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      # Athena runs its queries in the floci-duck service below. Without this variable,
      # Floci would start its own unpinned, uncapped copy (which needs the Docker socket).
      FLOCI_SERVICES_DUCK_URL: http://floci-duck:3000
    volumes:
      - floci-data:/app/data        # named volume: lives inside Docker's WSL2 VM
      # No Docker socket: Floci starts no containers (MSK replaced by Redpanda, Athena uses floci-duck).
      # The socket would give Floci full control of the Docker engine (root-equivalent).
    depends_on:
      - floci-duck
    mem_limit: 1g

  floci-duck:
    # Athena's query engine: DuckDB behind a small HTTP API (port 3000). Stateless.
    # Distroless image (no shell, no curl): Docker cannot run a healthcheck inside it.
    image: floci/floci-duck:0.3.0@sha256:7d9a084d83ddace3bd760db574ee1bf25012a90503099c83e97b691d738e2360
    environment:
      FLOCI_DUCK_S3_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?copy .env.example to .env}
      FLOCI_DUCK_S3_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?copy .env.example to .env}
      FLOCI_DUCK_S3_REGION: ${AWS_DEFAULT_REGION:?copy .env.example to .env}
      # floci-duck downloads DuckDB's httpfs extension at startup; keep it in a volume so it is downloaded only once.
      FLOCI_DUCK_EXT_DIR: /extensions
    volumes:
      - floci-duck-ext:/extensions
    mem_limit: 512m

  redpanda:
    # Kafka API. Replaces Floci's MSK, whose broker disappeared when Floci restarted (M0, ADR 0001).
    # Based on Redpanda's single-broker Docker Compose lab.
    image: redpandadata/redpanda:v26.2.6@sha256:8b1076e0d61bfceb66594dc01536427ce0b529f8ead35fdab9763ab6085891ce
    command:
      - redpanda
      - start
      # internal listener for containers (redpanda:9092), external listener for the Windows host (localhost:19092)
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      # dev-container: presets for local development. It trades durability for speed
      # (fsync bypassed, write caching on) and auto-creates topics. Revisited in M3.
      - --mode dev-container
      - --smp 1                     # use a single CPU core
      - --default-log-level=info
    ports:
      - "19092:19092"               # Kafka API from the host
      - "18081:18081"               # Schema Registry from the host (used in M3)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --- Tools: in the "tools" profile, so `up` never starts them. Use `docker compose run --rm <tool> ...` ---

  awscli:
    image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
    profiles: ["tools"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?copy .env.example to .env}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:?copy .env.example to .env}
      AWS_ENDPOINT_URL: http://floci:4566   # inside the Docker network (the localhost value in .env is for the host)
      AWS_CONFIG_FILE: /aws/config
      AWS_PAGER: ""                 # print output directly instead of opening the "less" pager
    volumes:
      - ./config/aws-config:/aws/config:ro
    depends_on:
      - floci

  rpk:
    # Same pinned image as the broker, used only as a Kafka client (rpk = Redpanda's Kafka CLI).
    image: redpandadata/redpanda:v26.2.6@sha256:8b1076e0d61bfceb66594dc01536427ce0b529f8ead35fdab9763ab6085891ce
    profiles: ["tools"]
    entrypoint: ["rpk"]
    mem_limit: 256m
    depends_on:
      - redpanda

  # --- Jobs: in the "jobs" profile, run on demand with `docker compose run --rm spark` ---

  spark:
    # M4: PySpark in local mode (driver + 2 task threads in one JVM): Kafka -> bronze Parquet on Floci's S3.
    build: ./spark                  # apache/spark 4.2.0 + s3a and Kafka connector jars, see spark/Dockerfile
    image: sme-lake-spark:4.2.0     # name of the image built from spark/Dockerfile
    profiles: ["jobs"]
    environment:
      # Read by s3a's default credential chain; fake values accepted by Floci.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?copy .env.example to .env}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092   # internal listener: Spark runs inside the Docker network
    volumes:
      - ./spark/jobs:/jobs:ro       # PySpark jobs
    command: ["/opt/spark/bin/spark-submit", "/jobs/ingest_bronze.py"]
    mem_limit: 1536m                # driver heap (1g) + JVM overhead + Python process
    depends_on:
      - floci
      - redpanda

  spark-connect:
    # M8: Spark as a service. A Spark Connect server listens on port 15002 and runs the jobs that clients
    # send over the network (Airflow in M8), so no container has to be created: no Docker socket needed.
    # Same image as the spark service (s3a and Kafka connector jars, spark-defaults.conf).
    image: sme-lake-spark:4.2.0
    profiles: ["pipeline"]
    command: ["/opt/spark/sbin/start-connect-server.sh", "--wait"]   # --wait: stay in the foreground
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?copy .env.example to .env}
    ports:
      - "15002:15002"               # Spark Connect, published for the M8 spike run from the host
    mem_limit: 1536m
    depends_on:
      - floci
      - redpanda

  # --- Airflow (M8), in the "pipeline" profile: `docker compose --profile pipeline up -d` ---

  airflow-postgres:
    # Airflow's metadata database (runs, task states, logs index), not the data of the platform.
    # 16.14 (2026-08-05) and not 16.15 (2026-11-07): the project only takes releases at least 14 days old.
    image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    profiles: ["pipeline"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    mem_limit: 256m

  airflow-init:
    # One-shot: creates or upgrades Airflow's database, and the admin login, then exits.
    # The only Airflow service with `build`: if all four had it, Compose would build the same image four
    # times in parallel and the builds would collide on its name ("image already exists").
    <<: *airflow-common
    build: ./airflow
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?copy .env.example to .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?copy .env.example to .env}
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-apiserver:
    # Web interface and API, on http://localhost:8088 (8080 is left to `dbt docs serve`).
    <<: *airflow-common
    command: api-server
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # It takes about a minute to start: checked every 5 s meanwhile, so the scheduler waits no longer than needed.
      start_period: 120s
      start_interval: 5s
    mem_limit: 1g
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    # Decides what runs when, and (LocalExecutor) runs the tasks itself: dbt runs inside this container.
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 1536m
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      # Every task asks the API server for permission to start (Airflow 3). Started before it, the scheduler
      # launched a task that timed out on that call and was killed (2026-11-14, run of midnight, at restart).
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    # Reads the DAG files in airflow/dags and stores their structure for the scheduler.
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  floci-data:
  floci-duck-ext:
  redpanda-data:
  airflow-postgres-data:
  airflow-warehouse:
  airflow-logs:
